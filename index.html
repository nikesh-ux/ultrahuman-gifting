<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultrahuman Gifting — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#112BAF; --blue-2:#1539F5; --ink:#000; --muted:rgba(0,0,0,.6); --faint:rgba(0,0,0,.4);
  --line:#D6D6D6; --soft:#F4F3F0; --soft-2:#EDEBE6; --white:#fff; --green:#0B7A4B;
  --r:16px; --r-lg:24px; --pill:50px;
  --display:'Barlow Condensed','Dharma Gothic E','Arial Narrow',sans-serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--white);font-size:16px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
img,svg{display:block}

/* ---------- type ---------- */
.eyebrow{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.88px;color:var(--muted)}
.display{font-family:var(--display);font-weight:300;text-transform:uppercase;letter-spacing:-.03em;line-height:.9}
.d-xl{font-size:clamp(64px,11.5vw,148px)}
.d-lg{font-size:clamp(52px,7.4vw,96px)}
.d-md{font-size:clamp(40px,5vw,64px)}
.h2{font-size:clamp(28px,3.6vw,44px);font-weight:400;letter-spacing:-.045em;line-height:1.05}
.h3{font-size:22px;font-weight:500;letter-spacing:-.035em;line-height:1.15}
.lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);letter-spacing:-.02em;max-width:560px}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 26px;border-radius:var(--pill);font-weight:500;font-size:15px;letter-spacing:-.015em;transition:.18s;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-2)}
.btn-secondary{background:#fff;color:#000;border:1px solid var(--line)}.btn-secondary:hover{border-color:#000}
.btn-dark{background:#000;color:#fff}.btn-dark:hover{background:#222}
.btn-ghost-w{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28)}.btn-ghost-w:hover{background:rgba(255,255,255,.2)}
.btn-white{background:#fff;color:#000}.btn-white:hover{background:#eee}
.btn-sm{height:38px;padding:0 18px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{font-weight:500;border-bottom:1px solid currentColor;cursor:pointer}

/* ---------- header ---------- */
.topbar{background:#000;color:#fff;font-size:12px;text-align:center;padding:9px 16px;letter-spacing:-.005em}
.topbar a{text-decoration:underline;text-underline-offset:2px;margin-left:6px;opacity:.85}
header.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid rgba(0,0,0,.06)}
.nav-in{max-width:1440px;margin:0 auto;height:64px;padding:0 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.nav-l{display:flex;align-items:center;gap:22px;font-size:12px}
.nav-l a,.nav-l button{opacity:.9;font-size:12px;font-weight:400;white-space:nowrap}
.nav-l a:hover,.nav-l button:hover{opacity:.55}
.nav-r{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.logo{font-weight:800;font-size:17px;letter-spacing:-.04em;font-style:italic;display:flex;align-items:center;gap:7px}
.logo i{display:inline-block;width:17px;height:14px;background:#000;clip-path:polygon(0 0,38% 0,50% 45%,62% 0,100% 0,62% 100%,38% 100%)}
.region{display:flex;align-items:center;gap:6px;font-size:12px;height:36px;padding:0 12px;border-radius:var(--pill);cursor:pointer;position:relative}
.region:hover{background:var(--soft)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.icon-btn:hover{background:var(--soft)}
.menu{position:absolute;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.12);padding:8px;z-index:70;min-width:230px;display:none}
.menu.open{display:block}
.menu a,.menu button.mi{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px;text-align:left}
.menu a:hover,.menu .mi:hover{background:var(--soft)}
.menu .mi.on{background:var(--soft);font-weight:500}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:var(--pill);background:var(--blue);color:#fff}
.tag-soft{background:var(--soft);color:#000}
.shopwrap{position:relative}
.shopwrap .menu{top:30px;left:-12px}
.region .menu{top:40px;right:0;min-width:260px}
@media(max-width:980px){.nav-l a{display:none}.nav-in{grid-template-columns:auto 1fr auto}.logo{justify-self:center}}
@media(max-width:560px){.nav-r .btn{display:none}}

/* ---------- layout ---------- */
.wrap{max-width:1440px;margin:0 auto;padding:0 12px}
.pad{padding:0 20px}
section{position:relative}
.sec{padding:88px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:36px;flex-wrap:wrap}
.sec-head .h2{max-width:700px}
.card{background:var(--soft);border-radius:var(--r-lg);padding:28px}
.card-w{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4,.g2{grid-template-columns:1fr}}
@media(min-width:901px) and (max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}}

/* ---------- hero (black card, like ultrahuman.com) ---------- */
.hero{background:#000;color:#fff;border-radius:var(--r-lg);margin:12px 0;min-height:min(86vh,760px);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(24px,4vw,56px)}
.hero .eyebrow{color:rgba(255,255,255,.7)}
.hero h1{margin:14px 0 22px;max-width:980px;position:relative;z-index:2}
.hero p.lead{color:rgba(255,255,255,.72);position:relative;z-index:2}
.hero-cta{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap;position:relative;z-index:2}
.hero-art{position:absolute;inset:0;z-index:1;pointer-events:none}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
@media(max-width:700px){.hero-art{opacity:.4;transform:translateY(-14%)}.hero{min-height:84vh}}

/* ---------- rings (pure css) ---------- */
.ring-w{display:inline-block;filter:drop-shadow(0 22px 26px rgba(0,0,0,.35));transform-style:preserve-3d}
.ring{display:block;width:var(--s);height:var(--s);border-radius:50%;
  background:conic-gradient(from 200deg,var(--c1),var(--c2) 22%,var(--c3) 45%,var(--c4) 70%,var(--c1));
  -webkit-mask:radial-gradient(circle,transparent 0 55%,#000 56.5%);mask:radial-gradient(circle,transparent 0 55%,#000 56.5%)}
.ring-w::after{content:"";position:absolute}
.art-ring{position:absolute}

/* ---------- vouchers / cards art ---------- */
.vcard{width:300px;height:188px;border-radius:20px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1539F5 0%,#112BAF 55%,#0A1A75 100%);box-shadow:0 30px 50px rgba(17,43,175,.35)}
.vcard .logo{color:#fff;font-size:13px}.vcard .logo i{background:#fff;width:13px;height:11px}
.vcard .amt{font-family:var(--display);font-weight:300;font-size:64px;line-height:.85;letter-spacing:-.03em}
.vcard .code{font-family:var(--mono);font-size:11px;opacity:.7}
.vcard::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;border:26px solid rgba(255,255,255,.1)}
.vcard.k{background:linear-gradient(135deg,#2a2a2a,#0b0b0b);box-shadow:0 30px 50px rgba(0,0,0,.35)}
.vcard.l{background:linear-gradient(135deg,#f3f1ec,#d9d5cb);color:#000;box-shadow:0 30px 50px rgba(0,0,0,.18)}
.vcard.l .logo{color:#000}.vcard.l .logo i{background:#000}

/* sizer set */
.sizers{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.sizer{border-radius:50%;border:7px solid #cfcac1;background:transparent;display:grid;place-items:center;font-size:11px;font-weight:600;color:#6f6a60;position:relative}
.sizer b{position:absolute;bottom:-20px;font-weight:500;font-size:11px;color:rgba(255,255,255,.6)}

/* ---------- path cards ---------- */
.path{border-radius:var(--r-lg);padding:28px;display:flex;flex-direction:column;justify-content:space-between;min-height:470px;position:relative;overflow:hidden;transition:transform .25s;cursor:pointer}
.path:hover{transform:translateY(-4px)}
.path.dark{background:#000;color:#fff}.path.dark .muted{color:rgba(255,255,255,.65)}
.path.soft{background:var(--soft)}
.path.blue{background:var(--blue);color:#fff}.path.blue .muted{color:rgba(255,255,255,.72)}
.path .art{position:relative;height:190px;margin:12px 0}
.path .meta{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px}
.grouplabel{display:flex;align-items:center;gap:10px;margin:0 0 12px 4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 11px;border-radius:var(--pill);background:rgba(255,255,255,.14)}
.path.soft .chip{background:#fff}

/* ---------- tabs / segmented ---------- */
.seg{display:inline-flex;background:var(--soft);border-radius:var(--pill);padding:4px;gap:2px;flex-wrap:wrap}
.seg button{height:38px;padding:0 20px;border-radius:var(--pill);font-size:14px;font-weight:500;color:var(--muted);transition:.15s}
.seg button.on{background:#000;color:#fff}

/* ---------- steps ---------- */
.step{background:var(--soft);border-radius:var(--r-lg);padding:26px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between}
.step .n{font-family:var(--display);font-size:56px;font-weight:300;line-height:.9;color:var(--blue)}
.step p{color:var(--muted);margin-top:8px;font-size:15px}
.step h4{font-size:19px;font-weight:500;letter-spacing:-.03em;line-height:1.15}

/* ---------- occasions ---------- */
.occ{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:22px 24px;background:#fff;border:1px solid var(--line);border-radius:var(--r);transition:.18s;cursor:pointer}
.occ:hover{border-color:#000;transform:translateY(-2px)}
.occ h4{font-size:19px;font-weight:500;letter-spacing:-.03em}
.occ p{color:var(--muted);font-size:14px;margin-top:3px}
.occ .arrow{flex:none;width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.occ:hover .arrow{background:var(--blue);color:#fff}

/* ---------- faq ---------- */
details.faq{border-top:1px solid var(--line)}
details.faq:last-child{border-bottom:1px solid var(--line)}
details.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 4px;font-size:19px;letter-spacing:-.03em;font-weight:400}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);position:relative}
details.faq summary i::before,details.faq summary i::after{content:"";position:absolute;left:9px;top:14px;width:12px;height:1.5px;background:#000;transition:.2s}
details.faq summary i::after{transform:rotate(90deg)}
details.faq[open] summary i::after{transform:rotate(0)}
details.faq .a{padding:0 60px 24px 4px;color:var(--muted);max-width:760px}

/* ---------- detail page layout ---------- */
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:22px 0 8px}
.crumb a:hover{color:#000}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:48px;align-items:start;padding:12px 0 90px}
.detail .main>section{margin-top:72px}
.detail .main>section:first-child{margin-top:0}
.sticky{position:sticky;top:84px}
@media(max-width:1020px){.detail{grid-template-columns:1fr;gap:28px}.sticky{position:static}.detail .main>section{margin-top:56px}}
.visual{background:#000;border-radius:var(--r-lg);height:420px;margin-top:30px;position:relative;overflow:hidden;color:#fff}
.visual .cap{position:absolute;left:24px;bottom:20px;font-size:12px;color:rgba(255,255,255,.6)}

/* ---------- configurator panel ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:0 1px 0 rgba(0,0,0,.02),0 24px 60px rgba(0,0,0,.06)}
.panel .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.panel hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.lbl{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:8px;display:block;letter-spacing:0}
.ringpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ringpick button{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:12px;align-items:center;text-align:left;transition:.15s;background:#fff}
.ringpick button:hover{border-color:#000}
.ringpick button.on{border:1.5px solid var(--blue);box-shadow:0 0 0 3px rgba(17,43,175,.12)}
.ringpick .th{width:52px;height:52px;border-radius:12px;background:#000;display:grid;place-items:center;flex:none;position:relative}
.ringpick b{display:block;font-weight:500;font-size:15px;letter-spacing:-.02em}
.ringpick span.p{font-size:13px;color:var(--muted)}
.single{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r)}
.single .th{width:52px;height:52px;border-radius:12px;background:#000;display:grid;place-items:center}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--pill);height:52px;overflow:hidden}
.stepper button{width:56px;height:100%;font-size:22px;color:#000;transition:.15s}
.stepper button:hover{background:var(--soft)}
.stepper input{flex:1;min-width:0;text-align:center;border:0;outline:0;font-size:20px;font-weight:500;background:transparent;-moz-appearance:textfield;letter-spacing:-.03em}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.qchips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.qchips button{height:32px;padding:0 14px;border-radius:var(--pill);border:1px solid var(--line);font-size:13px;font-weight:500}
.qchips button:hover{border-color:#000}
.qchips button.on{background:#000;color:#fff;border-color:#000}
.price-big{font-size:42px;font-weight:400;letter-spacing:-.06em;line-height:1}
.strike{text-decoration:line-through;color:var(--faint)}
.save{display:inline-flex;align-items:center;gap:6px;background:#E5F5EC;color:var(--green);font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--pill)}
.nudge{background:var(--soft);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.nudge b{color:#000;font-weight:500}
.fine{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.4}
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bands button{height:54px;border:1px solid var(--line);border-radius:14px;font-size:16px;font-weight:500;letter-spacing:-.03em;transition:.15s;background:#fff}
.bands button:hover{border-color:#000}
.bands button.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ---------- tables ---------- */
.tbl{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tbl .tr{display:grid;grid-template-columns:1.2fr 1fr 1.2fr 1.2fr;padding:18px 24px;border-top:1px solid var(--line);align-items:center;font-size:15px;transition:.2s}
.tbl .tr:first-child{border-top:0}
.tbl .th{font-size:11px;text-transform:uppercase;letter-spacing:.88px;color:var(--muted);background:var(--soft);font-weight:500}
.tbl .tr.on{background:var(--blue);color:#fff}
.tbl .tr.on .muted{color:rgba(255,255,255,.75)}
.pct{font-family:var(--display);font-size:34px;font-weight:300;line-height:1}
@media(max-width:560px){.tbl .tr{grid-template-columns:1fr 1fr 1fr;padding:14px 16px}.tbl .tr>:nth-child(3){display:none}}

/* ---------- lists ---------- */
.ticks{list-style:none;display:grid;gap:12px}
.ticks li{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.ticks li svg{flex:none;margin-top:3px}
.ticks.no li{color:var(--muted)}
.cov{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.cov{grid-template-columns:1fr}}
.kitlist{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:800px){.kitlist{grid-template-columns:1fr}}
.kit{background:var(--soft);border-radius:var(--r-lg);padding:24px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between}
.kit .ic{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center}

/* ---------- forms ---------- */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:500;color:var(--muted)}
.inp{height:52px;border:1px solid var(--line);border-radius:14px;padding:0 16px;outline:0;background:#fff;transition:.15s;width:100%;font-size:16px}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(17,43,175,.12)}
textarea.inp{height:auto;min-height:104px;padding:14px 16px;resize:vertical;line-height:1.4}
.inp.err{border-color:#C8261B;box-shadow:0 0 0 3px rgba(200,38,27,.1)}
.errmsg{font-size:12px;color:#C8261B;display:none}
.field.bad .errmsg{display:block}
.field.bad .inp{border-color:#C8261B}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.cnt{font-size:12px;color:var(--muted);text-align:right}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio button{height:46px;padding:0 20px;border:1px solid var(--line);border-radius:var(--pill);font-weight:500;font-size:14px}
.radio button.on{border-color:var(--blue);background:rgba(17,43,175,.06);color:var(--blue)}
.fstep{display:flex;gap:16px;margin-bottom:34px}
.fstep .num{flex:none;width:34px;height:34px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:500}
.fstep .body{flex:1;min-width:0}
.fstep h3{margin:4px 0 16px}

/* ---------- gift email preview ---------- */
.email{background:var(--soft);border-radius:var(--r-lg);padding:14px}
.email .bar{display:flex;gap:6px;padding:4px 6px 12px}.email .bar i{width:9px;height:9px;border-radius:50%;background:#d0cdc6}
.email .body{background:#000;color:#fff;border-radius:18px;padding:26px 24px;position:relative;overflow:hidden;min-height:340px;display:flex;flex-direction:column}
.email .body .to{font-family:var(--display);font-weight:300;font-size:46px;line-height:.9;text-transform:uppercase;letter-spacing:-.03em;margin:10px 0 12px;position:relative;z-index:2}
.email .body .msg{font-size:14px;color:rgba(255,255,255,.78);position:relative;z-index:2;font-style:italic;max-width:78%;min-height:20px}
.email .body .codebox{margin-top:auto;position:relative;z-index:2;background:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.35);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.email .rw{position:absolute;right:-30px;top:20px;z-index:1}

/* ---------- summary lines ---------- */
.sum .l{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:15px}
.sum .l.t{border-top:1px solid var(--line);margin-top:8px;padding-top:16px;font-size:20px;font-weight:500;letter-spacing:-.03em}
.sum .l span:first-child{color:var(--muted)}.sum .l.t span:first-child{color:#000}

/* ---------- mobile sticky pay bar ---------- */
.mbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));gap:14px;align-items:center;justify-content:space-between}
.mbar .s{font-size:12px;color:var(--muted);line-height:1.2}.mbar .s b{display:block;font-size:19px;color:#000;font-weight:500;letter-spacing:-.04em}

/* ---------- success ---------- */
.okmark{width:64px;height:64px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff}
.codes{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.codes .cr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--line)}
.codes .cr:first-child{border-top:0}
.codes .cr .idx{color:var(--faint);width:28px;font-size:13px}
.codes .cr .cd{flex:1;font-family:var(--mono);font-size:15px;font-weight:500;letter-spacing:.02em}
.codes .scroll{max-height:340px;overflow:auto}
.copy{height:32px;padding:0 14px;border-radius:var(--pill);border:1px solid var(--line);font-size:13px;font-weight:500}
.copy:hover{border-color:#000}
.copy.done{background:#E5F5EC;color:var(--green);border-color:transparent}
details.dev{margin-top:12px;border:1px dashed #b5b0a4;border-radius:var(--r);background:#FBFAF6}
details.dev summary{cursor:pointer;padding:14px 18px;font-size:13px;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details.dev summary::-webkit-details-marker{display:none}
details.dev table{width:calc(100% - 36px);margin:0 18px 16px;border-collapse:collapse;font-size:13px}
details.dev td{padding:7px 0;border-top:1px solid #e6e1d4;vertical-align:top}
details.dev td:first-child{color:var(--muted);width:42%;padding-right:12px}

/* ---------- redeem ---------- */
.redeem{max-width:560px;margin:60px auto 100px}
.codein{display:flex;gap:8px}
.res{margin-top:22px;border-radius:var(--r-lg);padding:24px;background:var(--soft)}

/* ---------- footer ---------- */
footer{background:#000;color:#fff;border-radius:var(--r-lg);margin:12px 0;padding:56px clamp(24px,4vw,56px) 36px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px}
footer a{display:block;color:rgba(255,255,255,.65);font-size:14px;padding:4px 0}footer a:hover{color:#fff}
footer .logo{color:#fff;font-size:20px}footer .logo i{background:#fff}

/* ---------- proto control ---------- */
.proto-btn{position:fixed;left:16px;bottom:16px;z-index:90;height:44px;padding:0 18px 0 14px;border-radius:var(--pill);background:#111;color:#fff;display:flex;gap:8px;align-items:center;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3)}

body.hasbar .proto-btn{bottom:96px}

.proto{position:fixed;left:16px;bottom:70px;z-index:95;width:min(420px,calc(100vw - 32px));max-height:min(78vh,720px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.25);padding:20px;display:none}
.proto.open{display:block}
body.hasbar .proto{bottom:150px}
@media(min-width:1021px){body.hasbar .proto{bottom:70px}}
.proto h5{font-size:11px;text-transform:uppercase;letter-spacing:.88px;color:var(--muted);font-weight:500;margin:18px 0 8px}

.proto .jumps{display:flex;flex-wrap:wrap;gap:6px}
.proto .jumps a{font-size:12px;font-weight:500;padding:6px 12px;border-radius:var(--pill);background:var(--soft)}
.proto .jumps a:hover{background:#000;color:#fff}
.proto ol,.proto ul{padding-left:18px;font-size:13px;color:#333;display:grid;gap:7px;line-height:1.4}
.proto select{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;width:100%;background:#fff}
.q{background:#FFF7E0;border-radius:10px;padding:8px 10px;list-style:none;margin-left:-18px}

/* toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,40px);background:#000;color:#fff;padding:12px 20px;border-radius:var(--pill);font-size:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.hasbar .toast{bottom:100px}

.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hide{display:none!important}

  const sNow=S.store, wrongStore = r.store!==sNow;
  const lines = {
    corporate:[`Sizing-kit code`,`Covers one ${RINGS[r.ring||'AIR'].name}. Ring products only. One use. Does not combine with other discounts.`,'Choose your size and finish'],
    voucher:[`Ring voucher · ${fmtS(r.value,r.store)} balance`,`Applies at checkout like a gift card, on any Ultrahuman product. Partial use allowed — the remainder stays on the code.`,'Start shopping'],
    giftcard:[`Gift card · ${RINGS[r.ring].name}`,`Covers one ${RINGS[r.ring].name}, any size and finish, with shipping and tax. Switching AIR ⇄ PRO is possible.`,'Choose your size and finish']
  }[r.type];
  out.innerHTML=`<div class="res fade">
    <div style="display:flex;gap:12px;align-items:center">${tick}<b style="font-weight:500;font-size:18px;letter-spacing:-.03em">${lines[0]}</b></div>
    <p class="muted" style="margin:10px 0 14px">${lines[1]}</p>
    <div class="sum"><div class="l"><span>Valid until</span><span>${fmtD(r.expires)}</span></div><div class="l"><span>Store</span><span>${STORES[r.store].flag} ${STORES[r.store].name}</span></div><div class="l"><span>Giver order</span><span>#${r.order}</span></div></div>
    ${wrongStore?`<div class="nudge" style="background:#FFF2D6">This code was issued on the <b>${STORES[r.store].name}</b> store. Switch store to redeem it.</div>`:''}
    <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="toast('Continues into the ring purchase flow (out of scope for this prototype)')">${lines[2]}</button></div>`;
}

/* =====================================================================
   ROUTER / RENDER
   ===================================================================== */
const ROUTES={ '':viewLanding,'gifting':viewLanding,'corporate':viewCorporate,'vouchers':viewVouchers,'gift-card':viewGift,'checkout':viewCheckout,'success':viewSuccess,'redeem':viewRedeem };
const BAR={ corporate:()=>({s:`${S.gsk.qty} kits · ${band(S.gsk.qty).pct}% off`,t:fmt(unit(S.gsk.qty)*S.gsk.qty),b:'Buy now',f:'buyGsk()'}),
  vouchers:()=>({s:`${S.v.qty} × ${fmt(S.v.band)} vouchers`,t:fmt(S.v.band*S.v.qty),b:'Pay',f:'buyV()'}),
  'gift-card':()=>({s:`${RINGS[S.ring].name}${S.gc.rName?' · for '+esc(S.gc.rName.split(' ')[0]):''}`,t:fmt(ringPrice()),b:'Pay',f:'buyGc()'}),
  checkout:()=>({s:'Total',t:fmt(S.cart?S.cart.total:0),b:'Pay',f:'pay()'}) };
const route=()=> (location.hash.replace(/^#\/?/,'')||'');
function paintBar(){
  const b=$('#mbar'), r=route(), cfg=BAR[r];
  if(!cfg){ b.className='mbar'; b.innerHTML=''; document.body.classList.remove('hasbar'); return; }
  const c=cfg(); b.className='mbar has';
  b.innerHTML=`<div class="s">${c.s}<b>${c.t}</b></div><button class="btn btn-primary" style="height:50px;flex:1;max-width:210px" onclick="${c.f}">${c.b}</button>`;
  document.body.classList.add('hasbar');
}
function render(keepScroll){
  const y=window.scrollY, r=route();
  const view=ROUTES[r]||viewLanding;
  ensureRing();
  $('#app').innerHTML=view();
  $('#regionLabel').textContent=st().flag+' '+st().label;
  paintBar(); paintMenus(); paintProto();
  if(keepScroll===true) window.scrollTo(0,y); else window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>render());

/* store menu + shop menu */
function paintMenus(){
  $('#regionMenu').innerHTML=`<div class="eyebrow" style="padding:8px 12px 6px">Store</div>`+Object.entries(STORES).map(([k,v])=>`<button class="mi ${S.store===k?'on':''}" onclick="setStore('${k}')"><span>${v.flag} ${v.name}</span><span class="muted small">${v.code}</span></button>`).join('');
}
function toggleMenu(id,e){ e.stopPropagation(); const m=$('#'+id), was=m.classList.contains('open'); closeMenus(); if(!was) m.classList.add('open'); }
function closeMenus(){ document.querySelectorAll('.menu').forEach(m=>m.classList.remove('open')); }
document.addEventListener('click',()=>closeMenus());
function setStore(k){
  S.store=k; ensureRing(); S.v.band=st().bands[1]; S.cart=null; closeMenus();
  render(true); toast('Store: '+st().name+' · '+st().code+(rings().length===1?' · only Ring AIR sold here':''));
}
function setRing(k){ S.ring=k; render(true); }

/* prototype panel */
function toggleProto(){ $('#proto').classList.toggle('open'); }
function paintProto(){
  $('#proto').innerHTML=`
  <h5>Store (currency · ring availability)</h5>
  <select onchange="setStore(this.value)">${Object.entries(STORES).map(([k,v])=>`<option value="${k}" ${S.store===k?'selected':''}>${v.flag} ${v.name} — ${v.code} — ${Object.keys(v.rings).join(' + ')}</option>`).join('')}</select>
  <h5>Jump to screen</h5>
  <div class="jumps">
    <a href="#/gifting">Landing</a><a href="#/corporate">Sizing kits</a><a href="#/vouchers">Vouchers</a><a href="#/gift-card">Gift card</a>
    <a href="#/checkout" onclick="S.cart=defaultCart('corporate')">Checkout</a>
    <a href="#/success" onclick="S.order=demo('corporate')">Success · kits</a><a href="#/success" onclick="S.order=demo('voucher')">Success · vouchers</a><a href="#/success" onclick="S.order=demo('giftcard')">Success · gift card</a>
    <a href="#/redeem">Redeem</a></div>
  <h5>Assumptions I made</h5>
  <ol>
    <li><b>Kits are pre-paid by the giver.</b> The giver pays the band-discounted ring price per kit and each code covers one ring. Kits ship free; no separate sizer fee.</li>
    <li>Discount bands (5 / 10 / 15 / 20 / 25%), ring prices and voucher band values per currency are <b>placeholders</b>.</li>
    <li>India is shown as <b>AIR-only</b> to demo the "no ring picker" rule.</li>
    <li>Vouchers are ring-agnostic, so no ring picker on that page.</li>
    <li>Checkout and payment are simulated. Redemption page is a stub.</li>
  </ol>
  <h5>Open questions for the brief</h5>
  <ol>
    <li class="q">GSK: "fixed amount off set by the band" and "recipient redeems at the discounted price" read two ways — does the recipient pay anything, or is the ring fully prepaid?</li>
    <li class="q">Is there a cap on GSK quantity (vouchers cap at 50)? Above it, route to sales?</li>
    <li class="q">GSK has no success page in the brief; I reused the voucher one (codes, CSV, share). OK?</li>
    <li class="q">Gift-card switch AIR→PRO: how does the redemption page collect the difference, and PRO→AIR forfeits value — is that clear enough at purchase?</li>
    <li class="q">Corporate vouchers: one value per order. Mixed values means multiple orders — acceptable for HR/ops buyers?</li>
    <li class="q">Entry points (pricing page, Shop menu): only the Shop menu is mocked.</li>
  </ol>`;
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeMenus(); $('#proto').classList.remove('open'); } });
window.addEventListener('resize',()=>{ clearTimeout(window._rz); window._rz=setTimeout(()=>{ if(route()===''||route()==='gifting') render(true); },250); });
render();
</script>
</body>
</html>
